services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ai_chat
      POSTGRES_USER: ai_chat
      POSTGRES_PASSWORD: ai_chat
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_chat"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data: {}

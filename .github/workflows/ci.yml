name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - uses: azure/setup-helm@v4
      - run: helm lint charts/ai-chat --set secrets.values.authSecret=abcdefghijklmnopqrstuvwxyz123456 --set secrets.values.encryptionKey=abcdefghijklmnopqrstuvwxyz123456 --set secrets.values.setupClaimToken=claim-token-abcdefghijklmnop --set postgresql.password=postgres-password-abcdefghijklmnop
      - run: helm template ai-chat charts/ai-chat --namespace ai-chat --set secrets.values.authSecret=abcdefghijklmnopqrstuvwxyz123456 --set secrets.values.encryptionKey=abcdefghijklmnopqrstuvwxyz123456 --set secrets.values.setupClaimToken=claim-token-abcdefghijklmnop --set postgresql.password=postgres-password-abcdefghijklmnop > /tmp/ai-chat.yaml

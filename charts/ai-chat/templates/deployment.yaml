apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-chat.fullname" . }}
  labels:
    {{- include "ai-chat.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/component: app
      {{- include "ai-chat.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: app
        {{- include "ai-chat.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["bun", "scripts/migrate.ts"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            - configMapRef: { name: {{ include "ai-chat.fullname" . }} }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ include "ai-chat.secretName" . }}, key: {{ .Values.secrets.keys.databaseUrl }} } }
            - name: BETTER_AUTH_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "ai-chat.secretName" . }}, key: {{ .Values.secrets.keys.authSecret }} } }
            - name: SETTINGS_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: {{ include "ai-chat.secretName" . }}, key: {{ .Values.secrets.keys.encryptionKey }} } }
      containers:
        - name: ai-chat
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: {{ include "ai-chat.fullname" . }} }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ include "ai-chat.secretName" . }}, key: {{ .Values.secrets.keys.databaseUrl }} } }
            - name: BETTER_AUTH_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "ai-chat.secretName" . }}, key: {{ .Values.secrets.keys.authSecret }} } }
            - name: SETTINGS_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: {{ include "ai-chat.secretName" . }}, key: {{ .Values.secrets.keys.encryptionKey }} } }
            {{- if .Values.config.setupClaimTokenRequired }}
            - name: SETUP_CLAIM_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "ai-chat.secretName" . }}, key: {{ .Values.secrets.keys.setupClaimToken }} } }
            {{- end }}
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-chat.fullname" . }}
  labels:
    {{- include "ai-chat.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.databaseUrl }}: {{ include "ai-chat.databaseUrl" . | quote }}
  {{ .Values.secrets.keys.authSecret }}: {{ required "secrets.values.authSecret is required when existingSecret is empty" .Values.secrets.values.authSecret | quote }}
  {{ .Values.secrets.keys.encryptionKey }}: {{ required "secrets.values.encryptionKey is required when existingSecret is empty" .Values.secrets.values.encryptionKey | quote }}
  {{- if or .Values.secrets.values.setupClaimToken .Values.config.setupClaimTokenRequired }}
  {{ .Values.secrets.keys.setupClaimToken }}: {{ required "secrets.values.setupClaimToken is required for an unclaimed public install" .Values.secrets.values.setupClaimToken | quote }}
  {{- end }}
{{- end }}
